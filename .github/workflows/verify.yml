name: Verify and prepare ClaimWeave
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claimweave-source
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Expand verified source archive on first run
        if: hashFiles('package.json') == ''
        run: |
          set -euo pipefail
          echo "4b5de4d5e9a9ccea8f5a2fbeb357548e7faf36118c685ee40e1f4c545eb20457  ClaimWeave-Project.zip" | sha256sum --check
          unzip -q ClaimWeave-Project.zip -d /tmp/claimweave-source
          cp -R /tmp/claimweave-source/dist /tmp/claimweave-source/docs /tmp/claimweave-source/scripts /tmp/claimweave-source/test .
          cp /tmp/claimweave-source/package.json /tmp/claimweave-source/server.mjs /tmp/claimweave-source/README.md /tmp/claimweave-source/ClaimWeave-Demo.html .
      - name: Expand verified v0.2 release once
        if: hashFiles('dist/lab.js') == '' && hashFiles('ClaimWeave-v02.zip') != ''
        run: |
          set -euo pipefail
          echo "6812d1dfdb5203bf081951434a499e75782ffcd304ade6733f087436491d3973  ClaimWeave-v02.zip" | sha256sum --check
          unzip -q ClaimWeave-v02.zip -d /tmp/claimweave-v02
          cp -R /tmp/claimweave-v02/dist /tmp/claimweave-v02/docs /tmp/claimweave-v02/scripts /tmp/claimweave-v02/test .
          cp /tmp/claimweave-v02/package.json /tmp/claimweave-v02/server.mjs /tmp/claimweave-v02/ClaimWeave-Demo.html .
      - name: Expand verified v0.3 backend once
        if: hashFiles('backend.mjs') == '' && hashFiles('ClaimWeave-v03.zip') != ''
        run: |
          set -euo pipefail
          echo "a5da2f20ce02016c41c713e92fe78f207300a5b7f19d5375cc85cba2b1ce036f  ClaimWeave-v03.zip" | sha256sum --check
          unzip -q ClaimWeave-v03.zip -d /tmp/claimweave-v03
          cp -R /tmp/claimweave-v03/dist /tmp/claimweave-v03/docs /tmp/claimweave-v03/scripts /tmp/claimweave-v03/test .
          cp /tmp/claimweave-v03/package.json /tmp/claimweave-v03/server.mjs /tmp/claimweave-v03/backend.mjs /tmp/claimweave-v03/README.md /tmp/claimweave-v03/Dockerfile .
      - run: npm test
      - name: Verify real HTTP account lifecycle
        if: hashFiles('backend.mjs') != ''
        run: npm run test:http
      - run: npm run build
      - run: node scripts/standalone.mjs
      - name: Prepare static demo
        run: |
          cp -R dist/. docs/
          touch docs/.nojekyll
      - name: Commit expanded source and verified demo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist docs scripts test package.json server.mjs README.md ClaimWeave-Demo.html
          if [ -f backend.mjs ]; then git add backend.mjs Dockerfile; fi
          if ! git diff --cached --quiet; then
            git commit -m "Expand verified ClaimWeave source and prepare demo"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: claimweave-static-demo
          path: dist
